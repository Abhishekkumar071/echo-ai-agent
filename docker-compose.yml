services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: echo_postgres
    environment:
      POSTGRES_USER: echo
      POSTGRES_PASSWORD: echo_password
      POSTGRES_DB: echo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echo -d echo_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: echo_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://echo:echo_password@postgres:5432/echo_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
